name: sentinel
version: "3.8"

x-common-env: &common-env
  TZ: ${TZ}
  NODE_ENV: ${NODE_ENV}

services:
  # ---------- DETECTION PI ----------
  web-app:
    profiles: ["detection"]
    container_name: web-app
    image: codingmanateees/sentinel:web-app
    environment:
      <<: *common-env

  core-api:
    profiles: ["detection"]
    container_name: core-api
    environment:
      <<: *common-env
      MQTT_URL: ${MQTT_URL}
    image: codingmanateees/sentinel:core-api

  detection-api:
    profiles: ["detection"]
    container_name: detection-api
    image: codingmanateees/sentinel:detection-api
    volumes:
      - ./resources/models:/app/model
      # Blueooth access
      - /var/run/dbus/:/var/run/dbus/:z
    devices:
      - /dev/bus/usb:/dev/bus/usb
      - /dev/hailo0:/dev/hailo0
    privileged: true
    environment:
      <<: *common-env
      FPS: 24
      MODEL_NAME: ${MODEL_NAME}
      CAMERA_URL_LIST: ${CAMERA_URL_LIST}
      CONFIG_IMGSIZE: ${CONFIG_IMGSIZE}
      CONFIG_VERBOSE: ${CONFIG_VERBOSE}
    depends_on:
      - go2rtc

  go2rtc:
    profiles: ["detection"]
    image: alexxit/go2rtc:latest
    container_name: go2rtc
    ports:
      - "1884:1884"
    restart: unless-stopped
    volumes:
      - ./infra/go2rtc/go2rtc.config.yaml:/config/go2rtc.yaml

  storage:
    profiles: ["detection"]
    container_name: storage
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - ./infra/minio/data:/data
    entrypoint: "minio server --address :7001 --console-address :7000 /data"
    restart: always

  nginx:
    profiles: ["detection"]
    image: nginx:latest
    container_name: reverse-proxy
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web-app
      - core-api
      - detection-api
      - storage
      - go2rtc

  # ---------- MAIN PI ----------
  mqtt:
    profiles: ["main"]
    image: eclipse-mosquitto:latest
    container_name: mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/config:/mosquitto/config
      - ./infra/mosquitto/data:/mosquitto/data
      - ./infra/mosquitto/log:/mosquitto/log

  bunker-api:
    profiles: ["main"]
    container_name: bunker-api
    image: codingmanateees/sentinel:bunker-api
    environment:
      MQTT_URL: mqtt://mqtt:1883
    depends_on:
      - mqtt

volumes:
  sentinel-database:
